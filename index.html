<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finora</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E🪙%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF2EC;--sf:#FFFFFF;--ink:#14302B;--mut:#5E736E;--ln:#D9E2DB;--inc:#1F7A5C;--exp:#C2503B;--p:#2F6F8F;--s:#7A6BB0;--t:#C98A1B;--acc:#14302B;--onacc:#F4F8F2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1A18;--sf:#162622;--ink:#E6EFEA;--mut:#93A9A2;--ln:#26393A;--inc:#4CC49A;--exp:#EE7C66;--p:#6FB3D6;--s:#A99BDB;--t:#E3AE45;--acc:#E6EFEA;--onacc:#0E1A18}}
:root[data-theme="dark"]{--bg:#0E1A18;--sf:#162622;--ink:#E6EFEA;--mut:#93A9A2;--ln:#26393A;--inc:#4CC49A;--exp:#EE7C66;--p:#6FB3D6;--s:#A99BDB;--t:#E3AE45;--acc:#E6EFEA;--onacc:#0E1A18}
*{box-sizing:border-box}
html,body{margin:0;height:auto}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 "Plus Jakarta Sans",system-ui,sans-serif;font-variant-numeric:tabular-nums}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--sf);border-top:1px solid var(--ln);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav a{flex:1;text-align:center;padding:8px 2px;font-size:12px;color:var(--mut);text-decoration:none;border-radius:12px;font-weight:500}
nav a.on{color:var(--onacc);background:var(--acc)}
.brand{display:none;font-weight:800;font-size:22px;padding:8px 14px 20px}
main{max-width:980px;margin:0 auto;padding:18px 16px 110px}
h1{font-size:15px;margin:0;color:var(--mut);font-weight:500}
h2{font-size:17px;margin:0 0 12px;font-weight:600}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
select,input,textarea,button{font:inherit;color:var(--ink)}
select,input,textarea{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:10px 12px;width:100%}
.top select{width:auto}
:focus-visible{outline:2px solid var(--p);outline-offset:2px}
.hero{padding:6px 2px 18px}
.big{font-size:clamp(34px,9vw,58px);font-weight:800;letter-spacing:-.03em;line-height:1.1}
.rib{display:flex;height:16px;border-radius:99px;overflow:hidden;background:var(--ln);margin:14px 0 8px}
.rib i{display:block;height:100%}
.leg{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--mut)}
.leg b{color:var(--ink);font-weight:600}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(2,1fr);margin-bottom:12px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:20px;padding:16px;margin-bottom:12px;overflow-x:auto}
.grid .card{margin:0;border-radius:16px}
.k{font-size:13px;color:var(--mut)}.v{font-size:19px;font-weight:600;margin-top:2px}
.pos{color:var(--inc)}.neg{color:var(--exp)}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:9px 6px;border-bottom:1px solid var(--ln);text-align:left;vertical-align:top}
th{font-weight:500;color:var(--mut);font-size:13px}.r{text-align:right;white-space:nowrap}
.chip{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;border:1px solid var(--ln);color:var(--mut)}
.btn{border:0;border-radius:12px;padding:10px 16px;background:var(--acc);color:var(--onacc);font-weight:600;cursor:pointer}
.btn.g{background:transparent;color:var(--ink);border:1px solid var(--ln)}
.btn.d{background:transparent;color:var(--exp);border:1px solid var(--ln)}
.sm{padding:4px 10px;font-size:13px}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:6;box-shadow:0 6px 18px rgba(20,48,43,.25);padding:14px 20px;border-radius:99px}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.empty{color:var(--mut);padding:18px 4px;text-align:center}
.ins{margin:0;padding:0;list-style:none}.ins li{padding:9px 0;border-bottom:1px solid var(--ln)}.ins li:last-child{border:0}
dialog{border:0;border-radius:22px;padding:20px;width:min(440px,94vw);background:var(--sf);color:var(--ink)}
dialog::backdrop{background:rgba(10,20,18,.5)}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
.err{color:var(--exp);font-size:13px;min-height:18px;margin-top:6px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(130px + env(safe-area-inset-bottom,0px));background:var(--acc);color:var(--onacc);padding:10px 16px;border-radius:12px;z-index:9}
.note{font-size:13px;color:var(--mut)}
@media(min-width:860px){
nav{top:0;bottom:auto;right:auto;width:210px;height:100%;flex-direction:column;border:0;border-right:1px solid var(--ln);padding:18px 12px;gap:4px}
nav a{text-align:left;padding:11px 14px;font-size:15px;flex:0}
.brand{display:block}
main{margin-left:230px;max-width:none;padding:28px 36px 60px}
.fab{bottom:28px}
.grid{grid-template-columns:repeat(4,1fr)}
.cols{display:grid;grid-template-columns:3fr 2fr;gap:12px}
}
@media print{nav,.fab,.top select,.noprint{display:none!important}main{margin:0;padding:0}body{background:#fff}.card{break-inside:avoid}}
</style>
</head>
<body>
<nav id="nav"><div class="brand">Finora</div>
<a href="#dashboard">Dashboard</a><a href="#transaksi">Transaksi</a><a href="#analisis">Analisis</a><a href="#laporan">Laporan</a><a href="#pengaturan">Pengaturan</a></nav>
<main id="app"></main>
<button class="btn fab" id="add">+ Catat</button>
<dialog id="dlg"></dialog>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>(n<0?'-':'')+'Rp\u00A0'+Math.abs(n).toLocaleString('id-ID');
const pct=v=>v==null?'–':(Math.round(v*1000)/10).toLocaleString('id-ID')+'%';
const INC=['Gaji','Uang saku','Freelance','Bisnis','Pendapatan investasi','Dividen','Pemasukan lain'];
const EXP={'Makanan':'p','Tempat tinggal':'p','Transportasi':'p','Utilitas':'p','Pendidikan':'p','Kesehatan':'p','Pakaian':'s','Hiburan':'s','Langganan':'s','Hobi':'s','Barang mewah':'t','Liburan mahal':'t','Barang premium':'t'};
const TN={p:'Primer',s:'Sekunder',t:'Tersier'};
const today=()=>new Date().toLocaleDateString('sv');
const KEY='finora.v1';
let S={opening:0,theme:'auto',tx:[]};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Penyimpanan browser tidak tersedia. Data hanya tersimpan sampai halaman ditutup.')}}
function toast(m){const e=document.createElement('div');e.className='toast';e.textContent=m;document.body.append(e);setTimeout(()=>e.remove(),3200)}
function theme(){S.theme==='auto'?document.documentElement.removeAttribute('data-theme'):document.documentElement.setAttribute('data-theme',S.theme)}
const ym=d=>d.slice(0,7);
const months=()=>[...new Set(S.tx.map(t=>ym(t.date)))].sort();
const ml=m=>new Date(m+'-01T00:00').toLocaleDateString('id-ID',{month:'short',year:'2-digit'});
const mlong=m=>new Date(m+'-01T00:00').toLocaleDateString('id-ID',{month:'long',year:'numeric'});
const prevM=m=>{let[y,mo]=m.split('-').map(Number);mo--;if(!mo){mo=12;y--}return y+'-'+String(mo).padStart(2,'0')};
let P=months().slice(-1)[0]||'all';
const inP=(t,p=P)=>p==='all'||t.date.startsWith(p);
function sum(l){const r={inc:0,exp:0,p:0,s:0,t:0,n:l.length};for(const t of l){if(t.type==='income')r.inc+=t.amt;else{r.exp+=t.amt;r[t.tier]+=t.amt}}r.net=r.inc-r.exp;
r.sav=r.inc>0?r.net/r.inc:null;r.er=r.inc>0?r.exp/r.inc:null;for(const k of'pst')r[k+'r']=r.exp>0?r[k]/r.exp:null;return r}
const cur=()=>sum(S.tx.filter(t=>inP(t)));
const plabel=()=>P==='all'?'Semua waktu':P.length===4?'Tahun '+P:mlong(P);
function periodSel(){const ms=months(),ys=[...new Set(ms.map(m=>m.slice(0,4)))];
return `<select id="per" aria-label="Periode"><option value="all">Semua waktu</option>${ys.map(y=>`<option value="${y}"${P===y?' selected':''}>Tahun ${y}</option>`).join('')}${ms.slice().reverse().map(m=>`<option value="${m}"${P===m?' selected':''}>${mlong(m)}</option>`).join('')}</select>`.replace(`value="all">`,`value="all"${P==='all'?' selected':''}>`)}
const empty=m=>`<div class="empty">${m}</div>`;
function chart(){const ms=months().slice(-6);if(!ms.length)return empty('Belum ada transaksi. Catat pemasukan atau pengeluaran pertama Anda.');
const d=ms.map(m=>{const x=sum(S.tx.filter(t=>t.date.startsWith(m)));return{m,i:x.inc,e:x.exp}});
const mx=Math.max(...d.flatMap(x=>[x.i,x.e]),1),W=560,H=160,g=W/d.length,bw=Math.min(24,g/3);
return `<svg viewBox="0 0 ${W} ${H+24}" width="100%" role="img" aria-label="Pemasukan dan pengeluaran per bulan">`+d.map((x,k)=>{const c=g*k+g/2,a=x.i/mx*H,b=x.e/mx*H;
return `<rect x="${c-bw-2}" y="${H-a}" width="${bw}" height="${a}" rx="5" fill="var(--inc)"><title>${ml(x.m)} pemasukan ${fmt(x.i)}</title></rect><rect x="${c+2}" y="${H-b}" width="${bw}" height="${b}" rx="5" fill="var(--exp)"><title>${ml(x.m)} pengeluaran ${fmt(x.e)}</title></rect><text x="${c}" y="${H+17}" text-anchor="middle" font-size="12" fill="var(--mut)">${ml(x.m)}</text>`}).join('')+`</svg><div class="leg"><span><i class="dot" style="background:var(--inc)"></i>Pemasukan</span><span><i class="dot" style="background:var(--exp)"></i>Pengeluaran</span></div>`}
function insights(c){const o=[];if(c.n<5)return['Data belum cukup untuk memberi wawasan. Catat minimal 5 transaksi pada periode ini.'];
if(c.inc>0&&c.exp>c.inc)o.push('Pengeluaran melebihi pemasukan pada periode ini, selisihnya '+fmt(c.exp-c.inc)+'.');
if(c.pr!=null&&c.pr>.6)o.push('Pengeluaran primer mendominasi: '+pct(c.pr)+' dari total pengeluaran.');
if(c.tr!=null&&c.tr>.2)o.push('Pengeluaran tersier mencapai '+pct(c.tr)+' dari total. Tinjau apakah semuanya perlu.');
if(P.length===7){const pv=sum(S.tx.filter(t=>t.date.startsWith(prevM(P))));
if(pv.exp>0){const ch=(c.exp-pv.exp)/pv.exp;o.push('Pengeluaran '+(ch>=0?'naik ':'turun ')+pct(Math.abs(ch))+' dibanding '+mlong(prevM(P))+'.')}
if(pv.sav!=null&&c.sav!=null)o.push('Tingkat tabungan '+(c.sav>pv.sav?'membaik':c.sav<pv.sav?'menurun':'sama')+': '+pct(pv.sav)+' menjadi '+pct(c.sav)+'.')}
if(c.sav!=null&&c.sav>=.2)o.push('Tingkat tabungan '+pct(c.sav)+' sudah di atas 20%.');
return o.length?o:['Tidak ada hal yang menonjol pada periode ini.']}
const row=t=>`<tr><td>${t.date.split('-').reverse().join('/')}</td><td>${esc(t.desc)}${t.demo?' <span class="chip">contoh</span>':''}<br><span class="chip">${esc(t.cat)}</span>${t.tier?` <span class="chip">${TN[t.tier]}</span>`:''}</td><td class="r ${t.type==='income'?'pos':'neg'}">${t.type==='income'?'+':'-'}${fmt(t.amt)}</td></tr>`;
const V={};
V.dashboard=()=>{const a=sum(S.tx),bal=S.opening+a.net,c=cur();
const rib=c.exp>0?`<div class="rib" role="img" aria-label="Komposisi pengeluaran"><i style="width:${c.pr*100}%;background:var(--p)"></i><i style="width:${c.sr*100}%;background:var(--s)"></i><i style="width:${c.tr*100}%;background:var(--t)"></i></div><div class="leg">${['p','s','t'].map(k=>`<span><i class="dot" style="background:var(--${k})"></i>${TN[k]} <b>${pct(c[k+'r'])}</b> · ${fmt(c[k])}</span>`).join('')}</div>`:`<div class="rib"></div><div class="note">Komposisi pengeluaran muncul setelah ada pengeluaran pada periode ini.</div>`;
const rec=S.tx.slice().sort((x,y)=>y.date.localeCompare(x.date)||y.id.localeCompare(x.id)).slice(0,5);
return `<div class="top"><h1>Total saldo (kas)</h1>${periodSel()}</div>
<div class="hero"><div class="big ${bal<0?'neg':''}">${fmt(bal)}</div><div class="note">Saldo awal ${fmt(S.opening)} + arus kas bersih seluruh waktu. Pengeluaran ${esc(plabel())}:</div>${rib}</div>
<div class="grid"><div class="card"><div class="k">Pemasukan</div><div class="v pos">${fmt(c.inc)}</div></div><div class="card"><div class="k">Pengeluaran</div><div class="v neg">${fmt(c.exp)}</div></div><div class="card"><div class="k">Arus kas bersih</div><div class="v ${c.net<0?'neg':'pos'}">${fmt(c.net)}</div></div><div class="card"><div class="k">Tingkat tabungan</div><div class="v">${pct(c.sav)}</div></div></div>
<div class="cols"><div><div class="card"><h2>Pemasukan vs pengeluaran</h2>${chart()}</div>
<div class="card"><h2>Transaksi terbaru</h2>${rec.length?`<table>${rec.map(row).join('')}</table>`:empty('Belum ada transaksi.')}</div></div>
<div class="card"><h2>Wawasan</h2><ul class="ins">${insights(c).map(i=>`<li>${i}</li>`).join('')}</ul></div></div>`};
let F={type:'all',q:'',sort:'d',n:15};
V.transaksi=()=>`<div class="top"><h1>Riwayat transaksi · ${esc(plabel())}</h1>${periodSel()}</div>
<div class="tabs">${[['all','Semua'],['income','Pemasukan'],['expense','Pengeluaran']].map(([k,l])=>`<button class="btn ${F.type===k?'':'g'} sm" data-a="ft" data-v="${k}">${l}</button>`).join('')}</div>
<div class="row" style="margin-bottom:12px"><input id="q" placeholder="Cari deskripsi atau kategori" value="${esc(F.q)}" style="flex:2;min-width:160px"><select id="so" style="flex:1;min-width:140px"><option value="d"${F.sort==='d'?' selected':''}>Terbaru</option><option value="o"${F.sort==='o'?' selected':''}>Terlama</option><option value="a"${F.sort==='a'?' selected':''}>Nominal terbesar</option></select></div><div class="card" id="list"></div>`;
function list(){const q=F.q.toLowerCase();let l=S.tx.filter(t=>inP(t)&&(F.type==='all'||t.type===F.type)&&(!q||(t.desc+' '+t.cat+' '+(t.note||'')).toLowerCase().includes(q)));
l.sort(F.sort==='a'?(a,b)=>b.amt-a.amt:F.sort==='o'?(a,b)=>a.date.localeCompare(b.date):(a,b)=>b.date.localeCompare(a.date));
const s=sum(l),sh=l.slice(0,F.n);
$('#list').innerHTML=l.length?`<div class="note" style="margin-bottom:8px">${l.length} transaksi · pemasukan ${fmt(s.inc)} · pengeluaran ${fmt(s.exp)}</div><table>${sh.map(t=>row(t).replace('</tr>',`<tr><td></td><td colspan="2"><button class="btn g sm" data-a="ed" data-id="${t.id}">Ubah</button> <button class="btn d sm" data-a="del" data-id="${t.id}">Hapus</button></td></tr>`)).join('')}</table>${l.length>F.n?`<button class="btn g" style="margin-top:12px" data-a="more">Tampilkan lebih banyak</button>`:''}`:empty('Tidak ada transaksi yang cocok. Ubah filter atau periode, atau catat transaksi baru.')}
const RR=(n,f,v,i)=>`<tr><td>${n}<br><span class="note">${f}</span></td><td class="r">${v}</td><td>${i}</td></tr>`;
V.analisis=()=>{const c=cur();let h='';
const ratios=[['Tingkat tabungan','Arus kas bersih ÷ pemasukan',c.sav,c.sav==null?'Belum ada pemasukan.':c.sav>=.2?'Baik (20% atau lebih).':c.sav>=0?'Positif, tetapi di bawah 20%.':'Negatif: pengeluaran melebihi pemasukan.'],['Rasio pengeluaran','Pengeluaran ÷ pemasukan',c.er,c.er==null?'Belum ada pemasukan.':c.er<=.8?'Sehat (80% atau kurang).':'Tinggi.'],['Rasio primer','Primer ÷ total pengeluaran',c.pr,'Kebutuhan pokok. Di atas 60% berarti beban kebutuhan berat.'],['Rasio sekunder','Sekunder ÷ total pengeluaran',c.sr,'Kebutuhan pendukung.'],['Rasio tersier','Tersier ÷ total pengeluaran',c.tr,'Pengeluaran non-esensial. Di atas 20% layak ditinjau.']];
h+=`<div class="card"><h2>Rasio keuangan · ${esc(plabel())}</h2><table>${ratios.map(r=>RR(r[0],r[1],pct(r[2]),r[3])).join('')}</table></div>`;
const ms=months().slice(-6),rows=ms.map((m,k)=>{const x=sum(S.tx.filter(t=>t.date.startsWith(m))),pv=ms[k-1]===prevM(m)?sum(S.tx.filter(t=>t.date.startsWith(prevM(m)))):null,g=(a,b)=>pv&&b>0?pct((a-b)/b):'–';
return `<tr><td>${ml(m)}</td><td class="r">${fmt(x.inc)}<br><span class="note">${g(x.inc,pv&&pv.inc)}</span></td><td class="r">${fmt(x.exp)}<br><span class="note">${g(x.exp,pv&&pv.exp)}</span></td><td class="r">${fmt(x.net)}</td></tr>`}).join('');
h+=`<div class="card"><h2>Perbandingan bulanan (MoM)</h2>${rows?`<table><tr><th>Bulan</th><th class="r">Pemasukan</th><th class="r">Pengeluaran</th><th class="r">Bersih</th></tr>${rows}</table><div class="note" style="margin-top:8px">Persentase kecil = pertumbuhan dibanding bulan kalender sebelumnya; “–” bila bulan itu tidak ada data.</div>`:empty('Belum ada data.')}</div>`;
let sc=null;if(c.inc>0&&c.n>=5){const a=c.sav<0?0:Math.min(c.sav/.2,1)*40,b=c.er<=.8?30:Math.max(0,30*(1-c.er)/.2),d=c.pr<=.6?30:Math.max(0,30*(1-(c.pr-.6)/.4));sc=Math.round(a+b+d);sc={s:sc,a:Math.round(a),b:Math.round(b),d:Math.round(d)}}
h+=`<div class="card"><h2>Penilaian kesehatan keuangan</h2>${sc?`<div class="big">${sc.s}<span class="note"> / 100 · ${sc.s>=75?'Sehat':sc.s>=50?'Cukup':'Perlu perhatian'}</span></div><table>${RR('Tingkat tabungan','maks 40: penuh bila ≥20%',sc.a+' / 40','')}${RR('Rasio pengeluaran','maks 30: penuh bila ≤80%',sc.b+' / 30','')}${RR('Beban kebutuhan primer','maks 30: penuh bila ≤60%',sc.d+' / 30','')}</table>`:empty('Skor muncul bila ada pemasukan dan minimal 5 transaksi pada periode ini.')}<div class="note">Ini penilaian sederhana berbasis aturan yang transparan, bukan ukuran yang tervalidasi secara ilmiah. Stabilitas arus kas, disiplin anggaran, dan dana darurat belum dihitung di versi ini.</div></div>`;return `<div class="top"><h1>Analisis keuangan</h1>${periodSel()}</div>${h}`};
function repBase(){const start=P==='all'?'':P.length===4?P+'-01-01':P+'-01',before=start?sum(S.tx.filter(t=>t.date<start)):{net:0};const l=S.tx.filter(t=>inP(t)),c=sum(l),open=S.opening+before.net;return{l,c,open,close:open+c.net}}
V.laporan=()=>{const{l,c,open,close}=repBase(),by=(ty)=>{const m={};l.filter(t=>t.type===ty).forEach(t=>m[t.cat]=(m[t.cat]||0)+t.amt);return Object.entries(m).sort((a,b)=>b[1]-a[1])},rt=a=>a.length?a.map(([k,v])=>`<tr><td>${esc(k)}</td><td class="r">${fmt(v)}</td></tr>`).join(''):`<tr><td colspan="2" class="note">Tidak ada data.</td></tr>`;
return `<div class="top"><h1>Laporan · ${esc(plabel())}</h1>${periodSel()}</div><div class="row noprint" style="margin-bottom:12px"><button class="btn" data-a="csv">Ekspor CSV</button><button class="btn g" data-a="print">Cetak</button></div>
<div class="card"><h2>Ringkasan eksekutif</h2><table><tr><td>Saldo awal periode</td><td class="r">${fmt(open)}</td></tr><tr><td>Total pemasukan</td><td class="r pos">${fmt(c.inc)}</td></tr><tr><td>Total pengeluaran</td><td class="r neg">${fmt(c.exp)}</td></tr><tr><td>Arus kas bersih</td><td class="r">${fmt(c.net)}</td></tr><tr><td><b>Saldo akhir</b></td><td class="r"><b>${fmt(close)}</b></td></tr></table></div>
<div class="card"><h2>Laporan pemasukan dan pengeluaran</h2><div class="note" style="margin-bottom:8px">Laporan berbasis kas untuk keuangan pribadi, bukan laporan keuangan korporasi berbasis akrual.</div><table><tr><th colspan="2">Pemasukan per sumber</th></tr>${rt(by('income'))}<tr><th colspan="2">Pengeluaran per kategori</th></tr>${rt(by('expense'))}<tr><td><b>Arus kas bersih</b></td><td class="r"><b>${fmt(c.net)}</b></td></tr></table></div>
<div class="card"><h2>Arus kas</h2><div class="note">Klasifikasi aktivitas operasi, investasi, dan pendanaan belum tersedia: transaksi belum memuat rincian yang mendukungnya, jadi tidak ditampilkan agar tidak mengarang data.</div></div>`};
V.pengaturan=()=>`<div class="top"><h1>Pengaturan</h1></div>
<div class="card"><h2>Saldo awal</h2><div class="row"><input id="op" inputmode="numeric" value="${S.opening.toLocaleString('id-ID')}" style="flex:1"><button class="btn" data-a="op">Simpan</button></div><div class="note">Saldo awal tidak dihitung sebagai pemasukan.</div></div>
<div class="card"><h2>Tema</h2><select id="th"><option value="auto">Ikuti perangkat</option><option value="light"${S.theme==='light'?' selected':''}>Terang</option><option value="dark"${S.theme==='dark'?' selected':''}>Gelap</option></select></div>
<div class="card"><h2>Cadangan data</h2><div class="note" style="margin-bottom:10px">Data hanya tersimpan di browser ini. Menghapus data browser atau berganti perangkat dapat menghilangkan data. Salin cadangan JSON secara berkala.</div><div class="row"><button class="btn" data-a="bk">Cadangkan (JSON)</button><button class="btn g" data-a="rs">Pulihkan</button></div></div>
<div class="card"><h2>Data contoh</h2><div class="row"><button class="btn g" data-a="demo">Muat data contoh</button><button class="btn g" data-a="undemo">Hapus data contoh</button></div></div>
<div class="card"><h2>Hapus semua data</h2><button class="btn d" data-a="clear">Hapus semua</button></div>`;
function render(){const n=V[location.hash.slice(1)]?location.hash.slice(1):'dashboard';$('#app').innerHTML=V[n]();document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.hash==='#'+n));if(n==='transaksi')list()}
function form(id){const t=id?S.tx.find(x=>x.id===id):{type:'expense',date:today(),cat:'Makanan',amt:'',desc:'',note:''};const d=$('#dlg');
const opts=ty=>(ty==='income'?INC:Object.keys(EXP)).map(c=>`<option${c===t.cat?' selected':''}>${c}</option>`).join('');
d.innerHTML=`<h2>${id?'Ubah transaksi':'Catat transaksi'}</h2><div class="tabs"><button type="button" class="btn sm ${t.type==='expense'?'':'g'}" data-ty="expense">Pengeluaran</button><button type="button" class="btn sm ${t.type==='income'?'':'g'}" data-ty="income">Pemasukan</button></div>
<label for="fa">Jumlah (Rp)</label><input id="fa" inputmode="numeric" value="${t.amt?t.amt.toLocaleString('id-ID'):''}" placeholder="25.000"><label for="fd">Tanggal</label><input id="fd" type="date" value="${t.date}"><label for="fc">Kategori</label><select id="fc">${opts(t.type)}</select><label for="fs">Deskripsi</label><input id="fs" value="${esc(t.desc)}" placeholder="Opsional"><label for="fn">Catatan</label><input id="fn" value="${esc(t.note||'')}"><div class="err" id="fe" role="alert"></div><div class="row" style="margin-top:10px"><button class="btn" id="fsv">Simpan</button><button class="btn g" id="fcx">Batal</button></div>`;
let ty=t.type;d.showModal();setTimeout(()=>$('#fa').focus(),30);
d.querySelectorAll('[data-ty]').forEach(b=>b.onclick=()=>{ty=b.dataset.ty;d.querySelectorAll('[data-ty]').forEach(x=>x.classList.toggle('g',x!==b));t.cat=ty==='income'?INC[0]:'Makanan';$('#fc').innerHTML=opts(ty)});
$('#fa').oninput=e=>{const v=e.target.value.replace(/\D/g,'');e.target.value=v?(+v).toLocaleString('id-ID'):''};$('#fcx').onclick=()=>d.close();
$('#fsv').onclick=e=>{const b=e.target,amt=parseInt($('#fa').value.replace(/\D/g,''),10)||0,date=$('#fd').value,err=m=>$('#fe').textContent=m;
if(amt<=0)return err('Isi jumlah dengan angka lebih dari 0.');if(!/^\d{4}-\d{2}-\d{2}$/.test(date))return err('Pilih tanggal yang valid.');if(amt>1e13)return err('Jumlah terlalu besar.');
b.disabled=true;const cat=$('#fc').value,o={id:id||'t'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),type:ty,amt,date,cat,desc:$('#fs').value.trim()||cat,note:$('#fn').value.trim()};if(ty==='expense')o.tier=EXP[cat];
if(id)S.tx[S.tx.findIndex(x=>x.id===id)]=Object.assign(S.tx.find(x=>x.id===id),o);else S.tx.push(o);save();d.close();if(!inP(o))P=ym(date);render();toast('Tersimpan')}}
function textBox(title,val,ok){const d=$('#dlg');d.innerHTML=`<h2>${title}</h2><textarea id="tb" rows="10">${esc(val)}</textarea><div class="err" id="fe"></div><div class="row" style="margin-top:10px">${ok?`<button class="btn" id="tok">${ok}</button>`:`<button class="btn" id="tcp">Salin</button>`}<button class="btn g" id="fcx">Tutup</button></div>`;d.showModal();$('#fcx').onclick=()=>d.close();
if(!ok){$('#tb').select();$('#tcp').onclick=()=>{$('#tb').select();try{document.execCommand('copy');toast('Tersalin')}catch(e){toast('Pilih teks lalu salin manual')}}}return d}
function demo(){const n=new Date(),L=[];for(let k=2;k>=0;k--){const d=new Date(n.getFullYear(),n.getMonth()-k,1),m=d.toLocaleDateString('sv').slice(0,7),add=(day,type,cat,amt,desc)=>L.push({id:'demo'+L.length+m,demo:true,type,cat,amt,desc,date:m+'-'+String(day).padStart(2,'0'),note:'',tier:type==='expense'?EXP[cat]:undefined});
add(1,'income','Uang saku',2500000,'Kiriman bulanan');add(10,'income','Freelance',400000+k*150000,'Proyek desain');add(2,'expense','Tempat tinggal',900000,'Kos');add(5,'expense','Makanan',650000+k*50000,'Makan harian');add(8,'expense','Transportasi',200000,'Bensin');add(12,'expense','Langganan',54000,'Streaming');add(15,'expense','Hiburan',180000,'Nonton');add(20,'expense','Pakaian',250000,'Baju')}
S.tx=S.tx.filter(t=>!t.demo).concat(L);save();P=months().slice(-1)[0];render()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id;
if(a==='ft'){F.type=b.dataset.v;F.n=15;render()}else if(a==='more'){F.n+=15;list()}else if(a==='ed')form(id);
else if(a==='del'){if(confirm('Hapus transaksi ini? Semua perhitungan akan diperbarui.')){S.tx=S.tx.filter(t=>t.id!==id);save();render()}}
else if(a==='op'){const v=parseInt($('#op').value.replace(/\D/g,''),10)||0;S.opening=v;save();render();toast('Saldo awal disimpan')}
else if(a==='bk')textBox('Cadangan JSON (salin dan simpan)',JSON.stringify({app:'finora',v:1,data:S},null,1));
else if(a==='rs'){textBox('Tempel cadangan JSON','','Pulihkan');$('#tok').onclick=()=>{try{const j=JSON.parse($('#tb').value).data;if(!j||!Array.isArray(j.tx))throw 0;if(!confirm('Data saat ini akan diganti. Lanjutkan?'))return;S=Object.assign({opening:0,theme:'auto',tx:[]},j);save();theme();P=months().slice(-1)[0]||'all';$('#dlg').close();render();toast('Data dipulihkan')}catch(x){$('#fe').textContent='Format cadangan tidak valid. Tempel seluruh isi JSON dari tombol Cadangkan.'}}}
else if(a==='demo'){demo();toast('Data contoh dimuat')}else if(a==='undemo'){S.tx=S.tx.filter(t=>!t.demo);save();P=months().slice(-1)[0]||'all';render();toast('Data contoh dihapus')}
else if(a==='clear'){if(confirm('Hapus SEMUA data? Tindakan ini tidak bisa dibatalkan. Pastikan sudah membuat cadangan.')){S={opening:0,theme:S.theme,tx:[]};save();P='all';render()}}
else if(a==='print')window.print();
else if(a==='csv'){const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"',l=repBase().l.slice().sort((x,y)=>x.date.localeCompare(y.date));textBox('Ekspor CSV (salin, tempel ke Excel atau Sheets)','Tanggal,Jenis,Kategori,Tingkat,Deskripsi,Jumlah,Catatan\n'+l.map(t=>[t.date,t.type==='income'?'Pemasukan':'Pengeluaran',t.cat,t.tier?TN[t.tier]:'',t.desc,t.amt,t.note].map(q).join(',')).join('\n'))}});
document.addEventListener('change',e=>{if(e.target.id==='per'){P=e.target.value;render()}else if(e.target.id==='so'){F.sort=e.target.value;list()}else if(e.target.id==='th'){S.theme=e.target.value;save();theme()}});
document.addEventListener('input',e=>{if(e.target.id==='q'){F.q=e.target.value;F.n=15;list()}});
$('#add').onclick=()=>form();addEventListener('hashchange',render);theme();render();
</script>
</body>
</html>
